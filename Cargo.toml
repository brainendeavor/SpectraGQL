[workspace]
members = [
    ".",
]
resolver = "2"

[package]
name = "spectragql"
version = "0.1.0"
edition = "2024"
description = "The Write-Path Gateway for GraphQL built on Cloudflare Pingora"
license = "MIT"
repository = "https://github.com/brainendeavor/SpectraGQL"
homepage = "https://spectragql.dev"
readme = "README.md"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-nats = "0.40.0"
async-trait = "0.1"
libc = "0.2"
bytes = "1.10.1"
config = "0.15.11"
enum_dispatch = "0.3.13"
env_logger = "0.10"
apollo-parser = "0.8"
http = "1.3.1"
http-serde = "2.1.1"

log = "0.4"
lru = "0.18"
parking_lot = "0.12"
matchit = "0.8.6"
pingora = { version = "0.9.0", features = [
    "rustls",
    "proxy",
    "cache",
    "lb",
] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0.140", features = ["raw_value"] }
strum = "0.27.1"
strum_macros = "0.27.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "io-util"] }
uuid = { version = "1.16.0", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
regex = "1"
redis = { version = "0.23.3", default-features = false, features = ["tokio-comp", "connection-manager"] }
rskafka = "0.6"
lapin = { version = "4.10", default-features = false, features = ["tokio", "rustls", "rustls--ring"] }
iggy = "0.10.0"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
cel = { version = "0.14.5", features = ["json", "regex", "chrono"] }
wasmtime = { version = "48.0.2", default-features = false, features = ["cranelift", "pooling-allocator", "wat", "async", "runtime", "parallel-compilation"] }
wat = "1.259.0"

[dev-dependencies]
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
