bind_addr = "0.0.0.0:8000"

# Default Upstream (e.g. Core Monolith or primary query backend)
[upstream]
addr = "127.0.0.1:4000"
name = "default"

# Additional Named Microservice Upstreams
[upstreams.inventory]
addr = "127.0.0.1:5001"
name = "inventory"

[upstreams.crm]
addr = "127.0.0.1:5002"
name = "crm"

[gql]
paths = "/gql,/graphql"
ops_to_dispatch = "query, mutation, subscription"

# Mode A: The Default Workhorse Gateway
[gql.mode_a]
enabled = true
# Options: "response_with_failure" (default), "response_only", "raw_audit"
dispatch_policy = "response_with_failure"
timeout_ms = 3000

# Mode A Route Overrides: Route specific mutations to dedicated microservices
[gql.routes.inventory_update]
operation = "adjustInventory"
mode = "A"
upstream = "inventory"

[gql.routes.customer_address]
operation = "updateCustomerAddress"
mode = "A"
upstream = "crm"

# Mode B Route Overrides: Pure async command receipts (edge-terminated)
[gql.routes.bulk_import]
operation = "importCatalog"
mode = "B"
receipt_status = "ACCEPTED"

[dispatch]
# Options: "NATS", "KAFKA", "RABBITMQ", "IGGY", "REDIS_STREAMS", "SIERRADB", "WEBHOOK"
method = "NATS"
addr = "127.0.0.1:4222"
name = "default"
# Examples for other streaming backends:
# method = "KAFKA"
# addr = "127.0.0.1:9092"
#
# method = "RABBITMQ"
# addr = "amqp://guest:guest@127.0.0.1:5672/%2f"
#
# method = "IGGY"
# addr = "iggy://127.0.0.1:8090"
#
# method = "REDIS_STREAMS"
# addr = "redis://127.0.0.1:6379"
#
# method = "SIERRADB"
# addr = "redis://127.0.0.1:7379"

# Idempotency Engine: Local In-Memory or Distributed Redis/Valkey
[idempotency]
# Options: "memory" (default), "redis"
backend = "memory"
# addr = "127.0.0.1:6379"
ttl_secs = 300
max_capacity = 10000

# Realtime Subscriptions Engine: graphql-transport-ws WebSocket Edge Termination
[subscriptions]
enabled = true
topic_prefix = "spectra"
keepalive_secs = 25
client_buffer_capacity = 256

[rest]
paths = "/api,/api/{*path}"

